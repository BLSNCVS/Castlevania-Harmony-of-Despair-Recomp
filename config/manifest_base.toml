# Codegen manifest template for Castlevania: Harmony of Despair (Xbox 360 /
# XBLA). Generated by ReXGlue v0.10.0 and then customized; see docs/BRINGUP.md.
#
# 'hodtool stage-modules' copies this file to hodrecomp_manifest.toml in the
# project root (git-ignored, so paths below are relative to the root) and
# appends a [[modules]] entry for every DLL of the installed game and DLC:
#
#   hodtool stage-modules --game game --user-data <user data> \
#       --out modules --manifest hodrecomp_manifest.toml
#
# modules/ (git-ignored) then holds default.xex with the title update's
# default.xexp (the SDK applies patches automatically on load) and every DLL
# module with its .dllp patch.

[project]
name = "hodrecomp"
sdk_version = "0.10.0"
game_root = "modules"

[entrypoint]
file_path = "modules/default.xex"
out_directory_path = "generated/default"
includes = [
    # setjmp_address / longjmp_address, written by:
    #   hodtool scan game --write config/jmp.toml
    "config/jmp.toml",
    # Hand-maintained [functions], [[switch_tables]], [[midasm_hook]], ...
    "config/functions.toml",
    # Pointer-only functions without .pdata (tools/analysis/find_missing_functions.py)
    "config/functions_nopdata.toml",
]
